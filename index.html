<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7dce8">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Acua Nails Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff7fa;
      color: #403238;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      max-width: 560px;
      margin: auto;
      padding: 20px 16px 120px;
    }

    h1 {
      text-align: center;
      margin: 4px 0;
      font-size: 28px;
    }

    .sub {
      text-align: center;
      color: #8a6d78;
      margin: 0 0 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #efdce4;
      border-radius: 20px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 4px 18px rgba(80, 40, 60, 0.05);
    }

    h2 {
      font-size: 17px;
      margin: 0 0 12px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 12px;
      border: 1px solid #eadce2;
      border-radius: 14px;
      margin: 8px 0;
      background: #fff;
    }

    .option:has(input:checked) {
      border-color: #d18aa7;
      background: #fff3f7;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      accent-color: #b96789;
    }

    .price {
      font-weight: 700;
      white-space: nowrap;
    }

    .muted {
      font-size: 13px;
      color: #987d87;
    }

    .discount {
      color: #a34b70;
    }

    .disabled {
      opacity: 0.45;
    }

    .custom {
      display: grid;
      grid-template-columns: 1fr 90px auto;
      gap: 8px;
    }

    .custom input {
      width: 100%;
      padding: 12px;
      border: 1px solid #eadce2;
      border-radius: 12px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      background: #b96789;
      color: white;
      font-weight: 700;
    }

    .secondary {
      background: #f2dce5;
      color: #714d5c;
    }

    .summary {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #efdde5;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 18px rgba(70,40,50,0.08);
    }

    .summary-inner {
      max-width: 560px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .total {
      font-size: 26px;
      font-weight: 800;
    }

    .custom-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px dashed #eadce2;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Acua Nails 💅🏽</h1>
  <p class="sub">Price Calculator</p>

  <!-- SERVICES -->
  <section class="card">
    <h2>Services</h2>

    <div id="services"></div>

    <label class="option" id="refillRow">
      <span class="left">
        <input type="checkbox" id="refill">
        <span>
          <strong>Refill</strong>
          <div class="muted">Flat $10 discount</div>
        </span>
      </span>

      <span class="price discount">-$10</span>
    </label>
  </section>


  <!-- LENGTH -->
  <section class="card">

    <h2>
      Length
      <span class="muted">(single choice)</span>
    </h2>

    <div id="lengths"></div>

    <div class="muted">
      Length applies to nail services, not pedicures.
    </div>

  </section>


  <!-- NAIL ART -->
  <section class="card">

    <h2>
      Nail Art
      <span class="muted">(single choice)</span>
    </h2>

    <div id="art"></div>

  </section>


  <!-- REMOVAL / REPAIRS -->
  <section class="card">

    <h2>Removal & Repairs</h2>

    <div id="extras"></div>

  </section>


  <!-- CUSTOM ADD ON -->
  <section class="card">

    <h2>Custom Add-On</h2>

    <div class="custom">

      <input
        id="customName"
        placeholder="Add-on name"
      >

      <input
        id="customPrice"
        type="number"
        min="0"
        step="1"
        placeholder="$"
      >

      <button onclick="addCustom()">
        Add
      </button>

    </div>

    <div id="customList"></div>

  </section>


  <!-- RESET -->
  <section class="card">

    <button
      class="secondary"
      style="width:100%"
      onclick="resetAll()"
    >
      Reset Calculator
    </button>

  </section>

</div>


<!-- TOTAL -->
<div class="summary">

  <div class="summary-inner">

    <div>
      <div class="muted">Total</div>
      <div class="total" id="total">$0</div>
    </div>

    <button onclick="copyTotal()">
      Copy Total
    </button>

  </div>

</div>


<script>

/* =========================
   ACUA NAILS PRICES
========================= */

const services = [

  {
    id: "gel",
    name: "Gel Manicure",
    price: 35
  },

  {
    id: "structure",
    name: "Structure Manicure",
    price: 45
  },

  {
    id: "softgel",
    name: "Soft Gel",
    price: 40
  },

  {
    id: "overlay",
    name: "Polygel Overlay",
    price: 50
  },

  {
    id: "polygel",
    name: "Polygel",
    price: 60
  },

  {
    id: "pedi",
    name: "Pedicure",
    price: 30
  }

];


const lengths = [

  {
    id: "short",
    name: "Short",
    price: 0,
    display: "Included"
  },

  {
    id: "medium",
    name: "Medium",
    price: 5,
    display: "+$5"
  },

  {
    id: "long",
    name: "Long",
    price: 10,
    display: "+$10"
  },

  {
    id: "xl",
    name: "XL",
    price: 15,
    display: "+$15"
  }

];


const nailArt = [

  {
    id: "none",
    name: "No Nail Art",
    price: 0,
    display: "Included"
  },

  {
    id: "tier1",
    name: "Tier 1",
    price: 10,
    display: "+$10"
  },

  {
    id: "tier2",
    name: "Tier 2",
    price: 20,
    display: "+$20"
  },

  {
    id: "tier3",
    name: "Tier 3",
    price: 30,
    display: "+$30"
  },

  {
    id: "tier4",
    name: "Tier 4",
    price: 40,
    display: "+$40"
  }

];


const extras = [

  {
    id: "removal",
    name: "Removal",
    price: 10,
    display: "+$10"
  },

  {
    id: "repair",
    name: "Nail Repair",
    price: 5,
    display: "+$5"
  }

];


let customItems = [];


/* =========================
   CREATE OPTIONS
========================= */

function renderOptions(list, group, type = "radio") {

  return list.map((item, index) => {

    return `
      <label class="option">

        <span class="left">

          <input
            type="${type}"
            name="${group}"
            value="${item.id}"
            ${index === 0 ? "checked" : ""}
            onchange="calculate()"
          >

          <span>
            ${item.name}
          </span>

        </span>

        <span class="price">
          ${
            item.display !== undefined
              ? item.display
              : "$" + item.price
          }
        </span>

      </label>
    `;

  }).join("");

}


/* =========================
   LOAD OPTIONS
========================= */

document.getElementById("services").innerHTML =
  renderOptions(services, "service");


document.getElementById("lengths").innerHTML =
  renderOptions(lengths, "length");


document.getElementById("art").innerHTML =
  renderOptions(nailArt, "art");


document.getElementById("extras").innerHTML =
  renderOptions(extras, "extra", "checkbox");


document
  .getElementById("refill")
  .addEventListener("change", calculate);


/* =========================
   SELECTED OPTION
========================= */

function checked(group) {

  return document.querySelector(
    'input[name="' + group + '"]:checked'
  );

}


/* =========================
   CALCULATE TOTAL
========================= */

function calculate() {

  const selectedService =
    checked("service");

  const service =
    services.find(
      item => item.id === selectedService?.value
    );


  let total =
    service ? service.price : 0;


  const isPedicure =
    service?.id === "pedi";


  /* LENGTH */

  document
    .querySelectorAll("#lengths .option")
    .forEach(option => {

      option.classList.toggle(
        "disabled",
        isPedicure
      );

    });


  /* REFILL */

  document
    .getElementById("refillRow")
    .classList.toggle(
      "disabled",
      isPedicure
    );


  /* LENGTH PRICE */

  if (!isPedicure) {

    const selectedLength =
      checked("length");

    const length =
      lengths.find(
        item => item.id === selectedLength?.value
      );

    if (length) {

      total += length.price;

    }

  }


  /* NAIL ART */

  const selectedArt =
    checked("art");

  const art =
    nailArt.find(
      item => item.id === selectedArt?.value
    );

  if (art) {

    total += art.price;

  }


  /* REFILL DISCOUNT */

  if (
    document.getElementById("refill").checked &&
    !isPedicure
  ) {

    total -= 10;

  }


  /* REMOVAL + REPAIRS */

  document
    .querySelectorAll(
      'input[name="extra"]:checked'
    )
    .forEach(input => {

      const extra =
        extras.find(
          item => item.id === input.value
        );

      if (extra) {

        total += extra.price;

      }

    });


  /* CUSTOM ADD ONS */

  total += customItems.reduce(
    (sum, item) => sum + item.price,
    0
  );


  /* DISPLAY TOTAL */

  document.getElementById("total")
    .textContent =
      "$" + Math.max(0, total);

}


/* =========================
   CUSTOM ADD ON
========================= */

function addCustom() {

  const name =
    document
      .getElementById("customName")
      .value
      .trim();

  const price =
    Number(
      document
        .getElementById("customPrice")
        .value
    );


  if (
    !name ||
    !Number.isFinite(price) ||
    price < 0
  ) {

    return;

  }


  customItems.push({
    name: name,
    price: price
  });


  document.getElementById("customName").value = "";

  document.getElementById("customPrice").value = "";


  renderCustom();

  calculate();

}


/* =========================
   DISPLAY CUSTOM ADD ONS
========================= */

function renderCustom() {

  document.getElementById("customList")
    .innerHTML =

    customItems.map((item, index) => {

      return `

        <div class="custom-item">

          <span>
            ${item.name}
          </span>

          <strong>
            +$${item.price}
          </strong>

          <button
            class="secondary"
            onclick="removeCustom(${index})"
          >
            Remove
          </button>

        </div>

      `;

    }).join("");

}


/* =========================
   REMOVE CUSTOM ADD ON
========================= */

function removeCustom(index) {

  customItems.splice(index, 1);

  renderCustom();

  calculate();

}


/* =========================
   RESET
========================= */

function resetAll() {

  document.querySelector(
    'input[name="service"][value="gel"]'
  ).checked = true;


  document.querySelector(
    'input[name="length"][value="short"]'
  ).checked = true;


  document.querySelector(
    'input[name="art"][value="none"]'
  ).checked = true;


  document
    .querySelectorAll(
      'input[name="extra"]'
    )
    .forEach(input => {

      input.checked = false;

    });


  document.getElementById("refill")
    .checked = false;


  customItems = [];

  renderCustom();

  calculate();

}


/* =========================
   COPY TOTAL
========================= */

async function copyTotal() {

  try {

    await navigator.clipboard.writeText(
      document.getElementById("total").textContent
    );

  } catch (error) {

    console.log(error);

  }

}


/* START */

calculate();

</script>

</body>
</html>
