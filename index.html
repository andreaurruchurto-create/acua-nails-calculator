<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7dce8">
<link rel="manifest" href="manifest.webmanifest">
<title>Acua Nails Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7fa;color:#403238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:20px 16px 110px}h1{text-align:center;margin:4px 0;font-size:28px}.sub{text-align:center;color:#8a6d78;margin:0 0 20px}
.card{background:#fff;border:1px solid #efdce4;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(80,40,60,.05)}
h2{font-size:17px;margin:0 0 12px}.option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 12px;border:1px solid #eadce2;border-radius:14px;margin:8px 0}
.option:has(input:checked){border-color:#d18aa7;background:#fff3f7}.left{display:flex;align-items:center;gap:10px}.price{font-weight:700;white-space:nowrap}
input{accent-color:#b96789}.muted{font-size:13px;color:#987d87}.discount{color:#a34b70}.disabled{opacity:.45}
.custom{display:grid;grid-template-columns:1fr 90px auto;gap:8px}.custom input{width:100%;padding:12px;border:1px solid #eadce2;border-radius:12px;font-size:15px}
button{border:0;border-radius:12px;padding:11px 14px;background:#b96789;color:#fff;font-weight:700}.secondary{background:#f2dce5;color:#714d5c}
.summary{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid #efdde5;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(70,40,50,.08)}
.summary-inner{max-width:560px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.total{font-size:26px;font-weight:800}
.custom-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed #eadce2}
</style>
</head>
<body>
<div class="app">
<h1>Acua Nails 💅🏽</h1><p class="sub">Price Calculator</p>

<section class="card"><h2>Services</h2><div id="services"></div>
<label class="option" id="refillRow"><span class="left"><input type="checkbox" id="refill">
<span><strong>Refill</strong><div class="muted">10% discount? No — flat $10 discount</div></span></span><span class="price discount">-$10</span></label>
</section>

<section class="card"><h2>Length <span class="muted">(single choice)</span></h2><div id="lengths"></div><div class="muted">Length applies to nail services, not pedicures.</div></section>
<section class="card"><h2>Nail Art <span class="muted">(single choice)</span></h2><div id="art"></div></section>
<section class="card"><h2>Removal & Repairs</h2><div id="extras"></div></section>

<section class="card"><h2>Custom Add-On</h2>
<div class="custom"><input id="customName" placeholder="Add-on name"><input id="customPrice" type="number" min="0" step="1" placeholder="$"><button onclick="addCustom()">Add</button></div>
<div id="customList"></div></section>

<section class="card"><button class="secondary" style="width:100%" onclick="resetAll()">Reset Calculator</button></section>
</div>

<div class="summary"><div class="summary-inner"><div><div class="muted">Total</div><div class="total" id="total">$0</div></div>
<button onclick="copyTotal()">Copy Total</button></div></div>

<script>
const services=[["gel","Gel Manicure",35],["structure","Structure Manicure",45],["softgel","Soft Gel",40],["overlay","Polygel Overlay",50],["polygel","Polygel",60],["pedi","Pedicure",30]];
const lengths=[["short","Short",0,"Included"],["medium","Medium",5,"+$5"],["long","Long",10,"+$10"],["xl","XL",15,"+$15"]];
const art=[["none","No Nail Art",0,"Included"],["tier1","Tier 1",10,"+$10"],["tier2","Tier 2",20,"+$20"],["tier3","Tier 3",30,"+$30"],["tier4","Tier 4",40,"+$40"]];
const extras=[["removal","Removal",10,"+$10"],["repair","Nail Repair",5,"+$5"]];
let customItems=[];

function renderOptions(list,group,type="radio"){
  return list.map(([id,label,price,shown],i)=>`<label class="option"><span class="left">
  <input type="${type}" name="${group}" value="${id}" ${i===0?"checked":""} onchange="calculate()"><span>${label}</span></span>
  <span class="price">${shown}</span></label>`).join("");
}
servicesEl=document.getElementById("services"); servicesEl.innerHTML=renderOptions(services,"service");
document.getElementById("lengths").innerHTML=renderOptions(lengths,"length");
document.getElementById("art").innerHTML=renderOptions(art,"art");
document.getElementById("extras").innerHTML=renderOptions(extras,"extra","checkbox");
document.getElementById("refill").onchange=calculate;

function checked(group){return document.querySelector('input[name="'+group+'"]:checked')}
function calculate(){
  const s=services.find(x=>x[0]===checked("service")?.value); let total=s?s[2]:0;
  const pedi=s?.[0]==="pedi";
  document.querySelectorAll("#lengths .option").forEach(x=>x.classList.toggle("disabled",pedi));
  document.getElementById("refillRow").classList.toggle("disabled",pedi);
  if(!pedi){const l=lengths.find(x=>x[0]===checked("length")?.value); if(l)total+=l[2]}
  const a=art.find(x=>x[0]===checked("art")?.value); if(a)total+=a[2];
  if(document.getElementById("refill").checked&&!pedi)total-=10;
  document.querySelectorAll('input[name="extra"]:checked').forEach(e=>{const x=extras.find(y=>y[0]===e.value);if(x)total+=x[2]});
  total+=customItems.reduce((a,x)=>a+x.price,0);
  document.getElementById("total").textContent="$"+Math.max(0,total);
}
function addCustom(){
  const name=document.getElementById("customName").value.trim(), price=Number(document.getElementById("customPrice").value);
  if(!name||!Number.isFinite(price)||price<0)return;
  customItems.push({name,price});document.getElementById("customName").value="";document.getElementById("customPrice").value="";renderCustom();calculate();
}
function renderCustom(){document.getElementById("customList").innerHTML=customItems.map((x,i)=>`<div class="custom-item"><span>${x.name}</span><strong>+$${x.price}</strong><button class="secondary" onclick="removeCustom(${i})">Remove</button></div>`).join("")}
function removeCustom(i){customItems.splice(i,1);renderCustom();calculate()}
function resetAll(){
  document.querySelector('input[name="service"][value="gel"]').checked=true;
  document.querySelector('input[name="length"][value="short"]').checked=true;
  document.querySelector('input[name="art"][value="none"]').checked=true;
  document.querySelectorAll('input[name="extra"]').forEach(x=>x.checked=false);
  document.getElementById("refill").checked=false;customItems=[];renderCustom();calculate();
}
async function copyTotal(){try{await navigator.clipboard.writeText(document.getElementById("total").textContent)}catch(e){}}
calculate();
</script>
</body></html>
