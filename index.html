<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b5263">
<link rel="manifest" href="manifest.webmanifest">
<title>Acua Nails Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffafb;color:#493b42;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:auto;padding:24px 16px 36px}.brand{text-align:center;margin-bottom:18px}.brand h1{font:32px Georgia,serif;color:#7b5263;margin:0}.brand p{margin:4px 0;color:#927985;font-size:13px}
.card{background:#fff7fa;border:1px solid #ead6de;border-radius:22px;padding:16px;margin-bottom:12px}.card h2{font-size:15px;color:#7b5263;margin:0 0 11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{min-height:55px;border:1px solid #ead6de;border-radius:15px;background:white;color:#493b42;padding:10px;text-align:left;font-size:14px}.opt.selected{background:#f7d9e5;border-color:#d9aabc;font-weight:700}.price{display:block;font-size:12px;color:#927985;margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;border:1px solid #ead6de;border-radius:14px;padding:11px 12px;margin:7px 0;font-size:14px}.row input{width:20px;height:20px;accent-color:#b87991}
.custom{display:flex;gap:8px}.custom input{width:100%;min-width:0;border:1px solid #ead6de;border-radius:12px;padding:12px;font-size:16px}.custom button,.actions button:last-child{border:0;border-radius:12px;background:#7b5263;color:white;padding:12px 15px;font-weight:700}
.total{background:#f3d0dd;border-radius:20px;padding:17px;display:flex;justify-content:space-between;align-items:center}.total small{display:block;font-size:12px;color:#765263}.total strong{font-size:30px;color:#5f3d4c}
.actions{display:flex;gap:9px;margin-top:10px}.actions button{flex:1;border:1px solid #ead6de;border-radius:13px;padding:12px;background:white;color:#7b5263;font-weight:700}
.note{text-align:center;color:#987f89;font-size:11px;line-height:1.4}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="brand"><h1>Acua Nails ♡</h1><p>Service Price Calculator</p></div>
<section class="card"><h2>Choose your service</h2><div class="grid" id="services"></div></section>
<section class="card"><h2>Add-ons</h2><div id="addons"></div></section>
<section class="card"><h2>Custom add-on</h2><div class="custom"><input id="customName" placeholder="Name" aria-label="Custom add-on name"><input id="customPrice" type="number" min="0" placeholder="$" aria-label="Custom add-on price"><button id="addCustom">Add</button></div></section>
<div class="total"><div><small>ACUA NAILS TOTAL</small><span id="summary"></span></div><strong id="total">$0</strong></div>
<div class="actions"><button id="reset">Reset</button><button id="copy">Copy Total</button></div>
<p class="note">Designed for quick pricing while booking or during appointments.</p>
</main>
<script>
const services=[["Gel Manicure",45],["Structured Gel",55],["Soft Gel Extensions",65],["Polygel",70],["Gel Overlay",55],["Gel Fill",50]];
const addons=[["French Tips",10],["Chrome",10],["Nail Art — Tier 1",5],["Nail Art — Tier 2",15],["Nail Art — Tier 3",25],["Charms / 3D",10],["Soak-Off Removal",10],["Nail Repair",5]];
let service=null,chosen=[],custom=0;
const $=id=>document.getElementById(id), money=n=>"$"+Math.round(n);
function render(){
 $("services").innerHTML=services.map((x,i)=>`<button class="opt ${service===i?"selected":""}" data-s="${i}">${x[0]}<span class="price">${money(x[1])}</span></button>`).join("");
 $("addons").innerHTML=addons.map((x,i)=>`<label class="row">${x[0]} <span>+${money(x[1])} <input type="checkbox" data-a="${i}" ${chosen.includes(i)?"checked":""}></span></label>`).join("");
 update();
}
function update(){
 let total=service===null?0:services[service][1];
 chosen.forEach(i=>total+=addons[i][1]); total+=custom;
 $("total").textContent=money(total);
 $("summary").textContent=service===null?"":services[service][0]+(chosen.length?` + ${chosen.length} add-on${chosen.length>1?"s":""}`:"")+(custom?" + custom":"");
}
$("services").onclick=e=>{let b=e.target.closest("[data-s]");if(b){service=+b.dataset.s;render()}};
$("addons").onchange=e=>{let i=+e.target.dataset.a;if(Number.isInteger(i)){chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i];update()}};
$("customPrice").oninput=e=>{custom=Math.max(0,+e.target.value||0);update()};
$("addCustom").onclick=()=>{if($("customName").value.trim()&&custom>0){let row=document.createElement("label");row.className="row";row.innerHTML=`${$("customName").value.trim()} <span>+${money(custom)} ✓</span>`;$("addons").appendChild(row);$("customName").value="";custom=0;$("customPrice").value="";update()}};
$("reset").onclick=()=>{service=null;chosen=[];custom=0;$("customName").value="";$("customPrice").value="";render()};
$("copy").onclick=()=>navigator.clipboard?.writeText("Acua Nails total: "+$("total").textContent).then(()=>{ $("copy").textContent="Copied ✓";setTimeout(()=>$("copy").textContent="Copy Total",1200)});
render();
</script>
</body></html>
